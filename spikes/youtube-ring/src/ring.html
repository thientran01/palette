<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      /* Shell + hairline on THIS strip only. Viewport is a 12px bar —
         create-bounds never cover the 640×360 inset. Same reveal as ×. */
      .reveal {
        position: absolute;
        inset: 0;
        opacity: 0;
        pointer-events: none;
        transition: opacity 200ms cubic-bezier(0.65, 0, 0.35, 1);
      }
      html[data-hot] .reveal,
      html:has(:focus-visible) .reveal {
        opacity: 1;
      }
      .shell {
        position: absolute;
        inset: 0;
        background: rgb(20 18 16);
        box-shadow: inset 0 0 0 1px rgb(245 239 230 / 0.1);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="reveal">
      <div class="shell" aria-hidden="true"></div>
    </div>
    <script>
      document.addEventListener("contextmenu", (e) => e.preventDefault());
    </script>
  </body>
</html>
