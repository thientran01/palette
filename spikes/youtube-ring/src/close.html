<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      /* Reveal is data-hot (cursor in the RING) + :has(:focus-visible).
         Never :hover. Never :focus-within. Chrome never sits on the video. */
      #close {
        position: absolute;
        top: 0;
        right: 0;
        width: 20px;
        height: 20px;
        padding: 0;
        border: 0;
        background: transparent;
        color: rgb(245 239 230 / 0.55);
        cursor: pointer;
        opacity: 0;
        transition:
          opacity 140ms cubic-bezier(0.16, 1, 0.3, 1),
          background-color 140ms cubic-bezier(0.16, 1, 0.3, 1),
          color 140ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      html[data-hot] #close,
      html:has(:focus-visible) #close {
        opacity: 1;
      }
      #close .x {
        position: absolute;
        top: 0;
        right: 0;
        width: 12px;
        height: 12px;
        display: grid;
        place-items: center;
        font: 600 10px/1 "Segoe UI", sans-serif;
      }
      #close[data-over] {
        background: rgb(245 239 230);
        color: rgb(20 18 16);
      }
    </style>
  </head>
  <body>
    <button id="close" type="button" aria-label="Close"><span class="x">×</span></button>
    <script>
      const btn = document.getElementById("close");
      btn.addEventListener("pointerenter", () => btn.setAttribute("data-over", ""));
      btn.addEventListener("pointerleave", () => btn.removeAttribute("data-over"));
      btn.addEventListener("click", () => window.ipc.postMessage("close"));
      document.addEventListener("contextmenu", (e) => e.preventDefault());
    </script>
  </body>
</html>
