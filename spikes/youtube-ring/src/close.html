<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      /* × only. HWND is 20×20 top-right, L-clipped. Never a 664×384 child. */
      .reveal {
        position: absolute;
        inset: 0;
        opacity: 0;
        pointer-events: none;
        transition: opacity 200ms cubic-bezier(0.65, 0, 0.35, 1);
      }
      html[data-hot] .reveal,
      html:has(:focus-visible) .reveal {
        opacity: 1;
      }
      #close {
        position: absolute;
        top: 0;
        right: 0;
        width: 20px;
        height: 20px;
        padding: 0;
        border: 0;
        background: transparent;
        color: rgb(245 239 230 / 0.55);
        cursor: pointer;
        pointer-events: none;
      }
      html[data-hot] #close,
      html:has(:focus-visible) #close {
        pointer-events: auto;
      }
      #close .x {
        position: absolute;
        top: 0;
        right: 0;
        width: 12px;
        height: 12px;
        display: grid;
        place-items: center;
        font: 600 10px/1 "Segoe UI", sans-serif;
      }
      #close[data-over] {
        background: rgb(245 239 230);
        color: rgb(20 18 16);
      }
    </style>
  </head>
  <body>
    <div class="reveal">
      <button id="close" type="button" aria-label="Close"><span class="x">×</span></button>
    </div>
    <script>
      const btn = document.getElementById("close");
      btn.addEventListener("pointerenter", () => btn.setAttribute("data-over", ""));
      btn.addEventListener("pointerleave", () => btn.removeAttribute("data-over"));
      btn.addEventListener("click", () => window.ipc.postMessage("close"));
      document.addEventListener("contextmenu", (e) => e.preventDefault());
    </script>
  </body>
</html>
