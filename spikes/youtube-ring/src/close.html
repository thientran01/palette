<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      /* Shell + hairline + × share ONE reveal: data-hot (cursor in the RING)
         + :has(:focus-visible). Opacity only. EASE.inOut / DUR 3.
         Never :hover. Never :focus-within. Chrome never sits on the video. */
      .reveal {
        position: absolute;
        inset: 0;
        opacity: 0;
        pointer-events: none;
        transition: opacity 200ms cubic-bezier(0.65, 0, 0.35, 1);
      }
      html[data-hot] .reveal,
      html:has(:focus-visible) .reveal {
        opacity: 1;
      }
      .shell {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        border: 12px solid rgb(20 18 16);
        border-radius: 12px;
        box-shadow: inset 0 0 0 1px rgb(245 239 230 / 0.1);
        pointer-events: none;
      }
      #close {
        position: absolute;
        top: 0;
        right: 0;
        width: 20px;
        height: 20px;
        padding: 0;
        border: 0;
        background: transparent;
        color: rgb(245 239 230 / 0.55);
        cursor: pointer;
        pointer-events: none;
      }
      html[data-hot] #close,
      html:has(:focus-visible) #close {
        pointer-events: auto;
      }
      #close .x {
        position: absolute;
        top: 0;
        right: 0;
        width: 12px;
        height: 12px;
        display: grid;
        place-items: center;
        font: 600 10px/1 "Segoe UI", sans-serif;
      }
      #close[data-over] {
        background: rgb(245 239 230);
        color: rgb(20 18 16);
      }
    </style>
  </head>
  <body>
    <div class="reveal">
      <div class="shell" aria-hidden="true"></div>
      <button id="close" type="button" aria-label="Close"><span class="x">×</span></button>
    </div>
    <script>
      const btn = document.getElementById("close");
      btn.addEventListener("pointerenter", () => btn.setAttribute("data-over", ""));
      btn.addEventListener("pointerleave", () => btn.removeAttribute("data-over"));
      btn.addEventListener("click", () => window.ipc.postMessage("close"));
      document.addEventListener("contextmenu", (e) => e.preventDefault());
    </script>
  </body>
</html>
